<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <title>Quiz de JavaScript</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img
              src="/docs/5.3/assets/brand/bootstrap-logo.svg"
              alt="Bootstrap"
              width="30"
              height="24"
            />
          </a>
        </div>
      </nav>
    </header>

    <main class="container py-4">
      <h1 class="h3">Quiz de JavaScript</h1>
      <p id="placar" class="fw-bold">Pontos: 0</p>

      <section id="tela-inicio">
        <p>5 perguntas · 15 segundos cada</p>
        <button id="comecar" class="btn btn-primary">Começar</button>
      </section>

      <section id="tela-pergunta" class="d-none">
        <p id="numero" class="text-secondary small"></p>
        <h2 id="pergunta" class="h5"></h2>
        <progress
          id="barra"
          max="15"
          class="w-100"
          aria-label="Tempo restante"
        ></progress>
        <p><span id="tempo" class="fs-4 fw-bold"></span></p>
        <div id="opcoes" class="d-grid gap-2"></div>
        <p id="feedback" class="mt-3" aria-live="polite"></p>
      </section>

      <section id="tela-resultado" class="d-none">
        <h2 class="h4">Resultado</h2>
        <p id="resumo" class="fs-5"></p>
        <ul id="lista-resumo" class="list-group"></ul>
      </section>
    </main>

    <footer></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
